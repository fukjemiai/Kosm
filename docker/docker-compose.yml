services:
  # ── PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kosm
      POSTGRES_USER: kosm
      POSTGRES_PASSWORD: kosm_dev
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kosm']
      interval: 5s
      retries: 5

  # ── MailHog (dev mail catcher) ──────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI

  # ── Backend API (NestJS) ────────────────────────
  backend:
    build:
      context: ../packages/backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kosm
      DB_PASSWORD: kosm_dev
      DB_NAME: kosm
      # Keycloak – externí instance na https://auth.localhost/
      KEYCLOAK_URL: https://auth.localhost
      KEYCLOAK_REALM: kosm
      KEYCLOAK_CLIENT_ID: kosm-api
      JWT_ISSUER: https://auth.localhost/realms/kosm
      # CORS
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      # Mail
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: noreply@kosm.local
      # Guest token
      GUEST_TOKEN_SECRET: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy

  # ── Customer Frontend (React booking web) ───────
  customer-fe:
    build:
      context: ../packages/customer-fe
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - backend

  # ── Staff Frontend (React staff portál) ─────────
  staff-fe:
    build:
      context: ../packages/staff-fe
      dockerfile: Dockerfile
    ports:
      - '5174:80'
    depends_on:
      - backend

volumes:
  pg_data:
