version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kosm
      POSTGRES_USER: kosm
      POSTGRES_PASSWORD: kosm_dev
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kosm']
      interval: 5s
      retries: 5

  # ── Keycloak ────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/kosm
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: kosm
      KC_DB_PASSWORD: kosm_dev
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  # ── MailHog (dev mail server) ───────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # Web UI

  # ── Backend API ─────────────────────────────────
  # (for production-like testing, dev uses nest start --watch)
  # backend:
  #   build: ../packages/backend
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_USER: kosm
  #     DB_PASSWORD: kosm_dev
  #     DB_NAME: kosm
  #     KEYCLOAK_URL: http://keycloak:8080
  #     KEYCLOAK_REALM: kosm
  #     MAIL_HOST: mailhog
  #     MAIL_PORT: 1025
  #   depends_on:
  #     - postgres
  #     - keycloak

volumes:
  pg_data:
